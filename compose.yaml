services:
  intent-commit:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/intent-commit.sqlite
      SESSION_TTL_DAYS: 30
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FEDERATION_PRIVATE_KEY_PATH: /app/data/federation-private.pem
      FEDERATION_PUBLIC_KEY_PATH: /app/data/federation-public.pem
    volumes:
      - intent_commit_data:/app/data
    restart: unless-stopped

volumes:
  intent_commit_data:
